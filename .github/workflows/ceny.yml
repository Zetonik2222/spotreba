name: Ceny a zverejnenie

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 4 * * *"   # každé ráno cca 5:10
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stiahni dnešné ceny zo Slovnaftu
        run: python3 update_prices.py

      - name: Ulož ceny
        run: |
          git config user.name "ceny-bot"
          git config user.email "ceny-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Ceny palív $(date +%F)" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  zverejni:
    needs: aktualizuj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pokus1.outputs.page_url || steps.pokus2.outputs.page_url }}
    steps:
      - name: Chvíľu počkaj, kým GitHub balík zaregistruje
        run: sleep 20

      - id: pokus1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Ak to nevyšlo, počkaj 2 minúty
        if: steps.pokus1.outcome == 'failure'
        run: sleep 120

      - id: pokus2
        if: steps.pokus1.outcome == 'failure'
        uses: actions/deploy-pages@v4

name: Ceny a zverejnenie
on:
  push:
    branches: [main]
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.zverejni.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stiahni dnešné ceny zo Slovnaftu
        run: python3 update_prices.py
      - name: Ulož ceny
        run: |
          git config user.name "spotreba-ceny"
          git config user.email "spotreba-ceny@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Ceny palív $(date +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: zverejni
        uses: actions/deploy-pages@v4
